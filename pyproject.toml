[project]
name = "strategy-backtest-agent"
version = "1.1.0"
description = "Deterministic cryptocurrency strategy backtesting"
authors = []
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<4.0"
dynamic = ["dependencies"]

[tool.poetry]
packages = [{include = "strategy_backtest_agent", from = "src"}]
# The sdist ships the harmless configuration template, not repository outputs/tests.
include = [{path = ".env.example", format = "sdist"}]
# Independent of Git ignores, including builds from an unpacked sdist.
exclude = [
    "**/.env", "**/.env.*", "**/.envrc", "**/.pypirc",
    "**/__pycache__", "**/*.pyc", "**/*.pyo",
    "**/.venv", "**/venv", "**/*.egg-info",
    "**/.pytest_cache", "**/.mypy_cache", "**/.ruff_cache",
    "**/build", "**/dist", "**/.git", "**/.DS_Store",
]

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^2.2"
httpx = "^0.28"
pydantic = "^2.10"
openai = "^3.24.0"
python-dotenv = "^1.2.4"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
ruff = "^0.11"
mypy = "^1.15"
pandas-stubs = "^2.2"

[project.scripts]
strategy-backtest = "strategy_backtest_agent.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.mypy]
strict = true
files = ["src", "tests"]
[tool.pytest.ini_options]
testpaths = ["tests"]
