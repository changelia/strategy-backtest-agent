[project]
name = "strategy-backtest-agent"
version = "0.1.0"
description = "Deterministic cryptocurrency strategy backtesting"
authors = []
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.12,<4.0"
dynamic = ["dependencies"]

[tool.poetry]
packages = [{include = "strategy_backtest_agent", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"
pandas = "^2.2"
httpx = "^0.28"
pydantic = "^2.10"
openai = "^3.24.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3"
ruff = "^0.11"
mypy = "^1.15"
pandas-stubs = "^2.2"

[project.scripts]
strategy-backtest = "strategy_backtest_agent.cli:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
[tool.mypy]
strict = true
files = ["src", "tests"]
[tool.pytest.ini_options]
testpaths = ["tests"]
