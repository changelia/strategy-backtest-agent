name: Release distributions

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the validated tagged artifacts to PyPI after environment approval
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build-validate-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Verify release build context
        env:
          RELEASE_PUBLISH: ${{ github.event.inputs.publish || 'false' }}
        run: python tests/release_gate.py build
      - name: Install isolated packaging tools
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/packaging-tools"
          "$RUNNER_TEMP/packaging-tools/bin/python" -m pip install build twine packaging
      - name: Build, validate, install and offline-smoke both artifacts
        run: |
          set -euo pipefail
          release_work="$RUNNER_TEMP/release-validation"
          test ! -e "$release_work"
          "$RUNNER_TEMP/packaging-tools/bin/python" tests/packaging_ci.py \
            --checkout "$GITHUB_WORKSPACE" --work "$release_work"
          cd "$release_work/artifacts"
          shasum -a 256 ./*.whl ./*.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v5
        with:
          name: validated-v1.1.0-distributions
          path: ${{ runner.temp }}/release-validation/artifacts/*
          if-no-files-found: error
          retention-days: 14

  publish-pypi:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.publish == true &&
      startsWith(github.ref, 'refs/tags/')
    needs: build-validate-smoke
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/strategy-backtest-agent/
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tag, package version and main relationship
        env:
          RELEASE_PUBLISH: "true"
        run: python tests/release_gate.py publish
      - uses: actions/download-artifact@v6
        with:
          name: validated-v1.1.0-distributions
          path: ${{ runner.temp }}/release-artifacts
      - name: Verify the exact validated files
        run: |
          set -euo pipefail
          artifact_dir="$RUNNER_TEMP/release-artifacts"
          cd "$artifact_dir"
          shasum -a 256 --check SHA256SUMS
          test "$(find . -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')" = 1
          test "$(find . -maxdepth 1 -type f -name '*.tar.gz' | wc -l | tr -d ' ')" = 1
          mkdir "$GITHUB_WORKSPACE/dist"
          cp ./*.whl ./*.tar.gz "$GITHUB_WORKSPACE/dist/"
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: dist/
